spring.jackson.property-naming-strategy=SNAKE_CASE
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads
# Stub OCR: image/PDF uploads are matched by base filename to a fixture text file here.
app.fixtures-dir=task-a/fixtures/task-a
server.port=8067
# Unknown routes -> NoHandlerFoundException -> ROUTE_NOT_FOUND JSON (instead of Spring's default error page)
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Logging: request_id on every line
logging.pattern.level=%5p [%X{requestId:-}]
logging.level.org.project=INFO
